# ai-generated: 0% - by hand
global:
  resolve_timeout: 5m
route:
  receiver: chat
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="P1"']
      receiver: pager
receivers:
  - name: pager
    webhook_configs:
      - url: http://pager:8080/hook/pager
        send_resolved: true
  - name: chat
    webhook_configs:
      - url: http://pager:8080/hook/chat
        send_resolved: true
inhibit_rules:
  - source_matchers: ['alertname="PaymentDown"']
    target_matchers: ['severity="P2"']
    equal: [cluster]